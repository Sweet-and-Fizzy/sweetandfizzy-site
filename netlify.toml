[build]
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Remove at DNS cutover, when the site goes public.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Astro puts a content hash in every file name under /_astro/ (CSS, JS, fonts,
# optimized images), so a changed file always gets a new URL. Cache them for a
# year. HTML keeps Netlify's default (revalidate every visit) so deploys show at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed files from public/ (logo, favicons): a day.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
