[build]
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Astro puts a content hash in every file name under /_astro/ (CSS, JS, fonts,
# optimized images), so a changed file always gets a new URL. Cache them for a
# year. HTML keeps Netlify's default (revalidate every visit) so deploys show at once.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed files from public/ (logo, favicons): a day.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# URLs from the old WordPress site (sitemap_index.xml as of 2026-11-16), so
# links and search results keep landing somewhere useful. 301 = permanent.
