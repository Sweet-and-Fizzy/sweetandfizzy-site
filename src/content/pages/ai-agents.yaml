# AI agents and integrations page copy, from the Draft copy tab.
title: AI agents and integrations
description: AI assistants and agents for research computing programs that answer from your docs, read live system data and act with each user's own permissions.
accent: blue
hero:
  eyebrow: AI agents and integrations
  title: From answering questions to submitting jobs.
  body: "We build AI assistants and agents for research computing programs. They answer from your documentation, read live data from your systems, and act for a user with that user's own permissions. We test them against questions your staff write, so you know how well they work before your users rely on them."
  primary: { label: Plan a program partnership, href: /contact/?audience=program }
  secondary: { label: Read about the HUST paper, href: "#paper" }
sections:
  - kind: cards
    title: What we build
    items:
      - { title: Support agents, text: "Assistants that answer from your documentation and your live systems in one conversation, and hand off to a human with a ticket when they should." }
      - { title: MCP servers for your data, text: "MCP (Model Context Protocol) is the standard way AI tools like Claude connect to outside data. We wrap your APIs so any assistant can read allocations, system status, events or software listings directly." }
      - { title: Agent access to HPC, text: "Interfaces that let an assistant submit jobs, read output and manage files on a cluster, running as the signed-in user with your site's policies applied." }
      - { title: AI in your review and support workflows, text: "Tools that check submissions against your rubric and draft feedback, with a person making the final call." }
  - kind: rows
    title: Work in production
    items:
      - { title: ACCESS support agent, text: "One agent that answers ACCESS documentation questions and live questions in the same conversation, like which GPU resources are available or what is down for maintenance. It draws on 11 MCP servers covering allocations, compute resources, system status, events, announcements, software, affinity groups, NSF awards, usage metrics and ticketing. Supported by NSF award 2138286 under the ACCESS program.", link: { label: Read the case story, href: /work/access-ai-assistant/ } }
      - { title: ACCESS MCP servers, text: "Public MCP servers for the ACCESS program, hosted at mcp.access-ci.org. Anyone can add one to Claude and ask about ACCESS resources in plain language.", link: { label: See the setup guide, href: "https://mcp.access-ci.org/docs/getting-started" } }
      - { title: OOD API for Open OnDemand, text: "An Open OnDemand app that lets researchers and their AI assistants submit jobs, manage files and check on their cluster without a terminal. Every request runs as the signed-in user, inside the permission model Open OnDemand already has. Site operators set local policy in a plain text file that every AI client reads before acting. It is early software.", link: { label: See the code, href: "https://github.com/Sweet-and-Fizzy/ood-api" } }
      - { title: Appverse review assistant, text: "A Claude Code plugin that reviews app submissions to the Open OnDemand Appverse for structure, security, quality and maintenance. It produces an evidence-backed report and a draft reply, and a human reviewer decides.", link: { label: See the code, href: "https://github.com/Sweet-and-Fizzy/appverse-review" } }
  - kind: list
    dark: true
    title: How we keep it trustworthy
    items:
      - { title: "Tested against your questions.", text: "Before an agent ships, it is graded on questions your staff write, fact by fact, and checked again with every change." }
      - { title: "The user's own permissions.", text: "Agents act as the signed-in person, so they can never see or do more than that person can." }
      - { title: "Guardrails on anything risky.", text: "Access limited to what the task needs, sensitive files blocked, every action logged, and a clear warning before anything that cannot be undone." }
      - { title: "People make the call.", text: "Agents explain what they would do and wait for a person to confirm. Reviews and recommendations go to a person to decide." }
      - { title: "Open, with your choice of model.", text: "The code is public, so your program does not depend on us, and agents can run on open models hosted by a partner institution or on commercial models." }
  - kind: steps
    title: How an engagement runs
    lead: "Most programs write the work into a proposal, or bring us on as a contractor once they are funded. If you have budget now, a one or three week discovery sprint can map the work first."
    items:
      - { title: Plan it into your award, text: "For a new proposal we provide budget text and a letter of collaboration. Funded programs bring us on as a contractor." }
      - { title: Build with your team, text: "We connect your documentation and systems, and release early to a pilot group of your users." }
      - { title: Evaluate and report, text: "Your staff write the test questions, and the results become numbers for your annual reports." }
      - { title: Run it for the award, text: "Hosting, updates and tuning each year. The code is open, so the work outlives the award." }
  - kind: paper
    id: paper
    title: Paper
    paper: { venue: "HUST workshop at SC26 · November 2026", title: "From Answering to Acting: An AI Agent for Research Computing User Support", authors: "A. Pasquale, V. Gazula, J. E. Bacal", summary: "How the ACCESS support agent combines documentation search with live data from MCP servers, and how we test its answers." }
cta:
  title: Bring AI to your users, carefully.
  body: "Tell us what your users ask most and where your data lives. We can start with a discovery sprint, or write the work into your next proposal."
  button: Talk to us
  href: /contact/?audience=program
  secondary: { label: Planning a proposal?, href: /planning-a-proposal/ }
