# AI agents and integrations page copy, from the Draft copy tab.
title: AI agents and integrations
description: AI assistants and agents for research computing programs that answer from your docs, read live system data and act with each user's own permissions.
accent: blue
hero:
  eyebrow: AI agents and integrations
  title: From answering questions to submitting jobs.
  body: "We build AI assistants and agents for research computing programs. They answer from your documentation, read live data from your systems, and act for a user with that user's own permissions. We test them against questions your staff write, so you know how well they work before your users rely on them."
  primary: { label: Plan a program partnership, href: /contact/?audience=program }
  secondary: { label: Read about our SC26 paper, href: "#paper" }
  art: agents
sections:
  - kind: cards
    title: What we build
    items:
      - { title: Support agents, text: "Assistants that answer from documentation and live system data, and open a ticket for staff when a question needs a person. The ACCESS AI Assistant works this way." }
      - { title: MCP servers for your data, text: "MCP (Model Context Protocol) is an open protocol for connecting AI tools to outside data. We wrap existing APIs so assistants can read allocations, system status, events or software listings." }
      - { title: Agent access to HPC, text: "An Open OnDemand app that lets an assistant submit jobs, read output and manage files, running as the signed-in user under your site's existing policies." }
      - { title: Review assistants, text: "Tools that check submissions against a rubric and draft feedback for a reviewer to approve. We use one for Open OnDemand Appverse submissions." }
  - kind: rows
    title: Work in production
    items:
      - { title: ACCESS AI Assistant, text: "One agent that answers ACCESS documentation questions and live questions in the same conversation, like which GPU resources are available or what is down for maintenance. It draws on 11 live data servers covering allocations, compute resources, system status, events, announcements, software, affinity groups, NSF awards, usage charts, usage data and ticketing. Supported by NSF award 2138286 under the ACCESS program.", link: { label: Read the case story, href: /work/access-ai-assistant/ }, image: { src: ../../assets/work/access-ai-exchange.png, alt: "Illustration: a researcher asks whether anything is down for maintenance and how to get time on Delta. The ACCESS AI Assistant answers that there are no active outages and that Delta GPU time comes through ACCESS Allocations, starting at Explore. Labels: live system status, ACCESS docs, one answer." } }
      - { title: ACCESS MCP servers, text: "Public MCP servers for the ACCESS program, hosted at mcp.access-ci.org. Anyone can add one to Claude and ask about ACCESS resources in plain language.", link: { label: See the setup guide, href: "https://mcp.access-ci.org/docs/getting-started" }, image: { src: ../../assets/work/access-mcp-exchange.png, alt: "Illustration: a researcher in Claude asks what GPU programming workshops are coming up, and Claude, using the ACCESS MCP servers, names Modern GPU Programming on November 10, online, with the registration link. Labels: live ACCESS data, any MCP client, public." } }
      - { title: OOD API for Open OnDemand, text: "An Open OnDemand app that lets researchers and their AI assistants submit jobs, manage files and check on their cluster without a terminal. Every request runs as the signed-in user, inside the permission model Open OnDemand already has. Site operators set local policy in a plain text file that every AI client reads before acting. It is early software.", link: { label: See the OOD API code, href: "https://github.com/Sweet-and-Fizzy/ood-api" }, image: { src: ../../assets/work/ood-api-exchange.png, alt: "Illustration: a researcher asks an AI assistant to rerun an analysis on the GPU queue with 4 hours, and it replies that it submitted job 48213 as jsmith to the gpu partition. Labels underneath: your permissions, follows site policy, logged." } }
      - { title: Appverse review assistant, text: "A Claude Code plugin that reviews app submissions to the Open OnDemand Appverse for structure, security, quality and maintenance. It produces an evidence-backed report and a draft reply, and a human reviewer decides.", link: { label: See the review assistant code, href: "https://github.com/Sweet-and-Fizzy/appverse-review" }, image: { src: ../../assets/work/appverse-review-page.jpg, alt: "An Appverse review page for the PyMOL app, recommending Accept, with results for structure, security, portability, documentation and code quality" } }
  - kind: list
    dark: true
    title: Tested, safe and in your control
    items:
      - { title: "Tested against your questions.", text: "Graded fact by fact on questions your staff write, before launch and every release." }
      - { title: "The user's own permissions.", text: "Agents can only reach what the signed-in person can." }
      - { title: "Guardrails on anything risky.", text: "Only the access a task needs, sensitive files blocked, every action logged, and a warning before anything permanent." }
      - { title: "People make the call.", text: "Agents explain what they will do and wait for a person to confirm." }
      - { title: "Open, with your choice of model.", text: "The code is public, and agents run on open or commercial models." }
  - kind: quote
    title: Why not build it yourself?
    text: "We can build on our work for NSF ACCESS to quickly set up the backend that informs your AI assistant."
  - kind: steps
    title: How an engagement runs
    lead: "Have budget now? A one or three week discovery sprint can map the work first."
    items:
      - { title: Plan it into your award, text: "For a new proposal we provide budget text and a statement of work. Funded programs bring us on as a contractor." }
      - { title: Build with your team, text: "We connect your documentation and systems, and release early to a pilot group of your users." }
      - { title: Evaluate and report, text: "Test results become numbers for your annual reports." }
      - { title: Run it for the award, text: "Hosting, updates and tuning, every year." }
  - kind: paper
    id: paper
    title: Paper
    paper: { venue: "HUST workshop at SC26 · Accepted, November 2026", title: "From Answering to Acting: An AI Agent for Research Computing User Support", authors: "A. Pasquale, V. Gazula, J. E. Bacal", summary: "How the ACCESS AI Assistant combines documentation search with live data from MCP servers, and how we test its answers." }
cta:
  title: Bring an AI assistant to your users.
  body: "Tell us what your users ask most and where your data lives. We can write the work into your next proposal, or start under your current award."
  button: Talk to us
  href: /contact/?audience=program
  secondary: { label: Planning a proposal?, href: /planning-a-proposal/ }
