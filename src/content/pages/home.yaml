# Homepage copy, from the "Home page (was the Services page)" board.
# Edit text freely; bracketed [PLACEHOLDERS] block launch.
title: Sweet & Fizzy Digital
description: Community platforms and AI agents for research computing programs, plus product builds for startups and websites for organizations with a story to tell.
hero:
  title: We build the platforms and AI tools research computing runs on
  lead: "And we bring the same care to startups and to organizations with a story to tell."
  doors:
    - { n: "01", href: "#research", color: blue, title: Research computing, text: "Community platforms and AI tools that connect researchers to people, answers and computing." }
    - { n: "02", href: "#startups", color: orange, title: Startups, text: "Discovery sprints, product design and software to get your idea off the ground." }
    - { n: "03", href: "#websites", color: yellow, title: Websites & branding, text: "Websites, logos and brands for organizations with a story to tell, kept fast and safe after launch." }
areas:
  - id: research
    n: "01"
    color: blue
    title: Research computing
    lead: Community platforms and AI tools that connect researchers to people, answers and computing.
    facts:
      - "74,000 researchers on our platform"
      - "13 communities share Connect.CI"
      - "7 NSF awards since 2017"
    papersLink: { label: 5 papers published, href: /publications/ }
    offers:
      - title: AI agents and integrations
        body: "We adapt the agent we built for ACCESS to your program. It answers from your documentation and 11 live data sources, and acts with each user's own permissions. We test every agent on questions your staff write."
        link: { label: AI agents, href: /services/ai-agents/ }
      - title: Connect.CI platform
        body: "Start with features 13 research computing communities already share, like directories, events, mentorship and single sign-on, then fund only what is new for your program. Membership starts at $5,000 a year, and every improvement is shared."
        link: { label: Connect.CI, href: /connect-ci/ }
      - title: Curated catalogs
        body: "We built the Open OnDemand Appverse, the community app catalog that won best paper at PEARC 2026. We can build one for your program the same way, with submissions from GitHub and moderators who review each listing."
        link: { label: Explore the Appverse, href: /work/open-ondemand/#the-appverse }
    cta: { label: Tell us about your program, href: /contact/?audience=program }
    secondary: { label: Planning a proposal?, href: /planning-a-proposal/ }
    workTitle: Some of our research computing work
    work:
      - { name: ACCESS Support, line: "The support hub for the NSF ACCESS program: knowledge base, directory, affinity groups and matching services.", image: ../../assets/home/access-support.jpg, href: /work/access-support/ }
      - { name: ACCESS AI Assistant, line: An AI support agent that answers researchers from the ACCESS documentation and live system data in one conversation., image: ../../assets/home/access-ai.jpg, href: /work/access-ai-assistant/ }
    more:
      - { name: Open OnDemand, line: A refreshed openondemand.org and a Community Hub with a Contributor Wall, image: ../../assets/home/ood.jpg, href: /work/open-ondemand/ }
      - { name: Open OnDemand Appverse, line: "A shared catalog of Open OnDemand apps. Best paper, PEARC 2026", image: ../../assets/home/appverse.jpg, href: /work/open-ondemand/#the-appverse }
      - { name: Open OnDemand job submission, line: AI assistants that run computing jobs with the researcher’s own permissions, image: ../../assets/work/ood-api-exchange.png, href: /services/ai-agents/ }
      - { name: MGHPCC, line: "The mghpcc.org website, plus SC booths, a kiosk and a showcase of research projects", image: ../../assets/home/mghpcc.jpg, href: /work/mghpcc/ }
  - id: startups
    n: "02"
    color: orange
    title: Startups
    lead: Founders bring us ideas in fintech, education and beyond, and we help them ship.
    facts:
      - "Discovery sprints from $3,500"
      - "From a first sketch to launch"
      - "Technical leadership"
    offers:
      - { title: One or three week discovery sprint, body: "Hands-on sessions sharpen your idea into an MVP scope, so you know what to build first. You leave with a plan, designs, and a budget and timeline you can show investors." }
      - { title: Software design and development, body: "We design and build your web and mobile apps, with AI features where they help, from the first version to launch. After launch, we stay on for support and improvements." }
      - { title: Technical and product leadership, body: "We can help with your business decisions, from roadmaps and hiring to investor and board updates. We step in as fractional technical and product leadership until you are ready to hire a full-time CTO." }
    cta: { label: Tell us about your startup, href: /contact/?audience=startup }
    workTitle: Some of our startup work
    work:
      - { name: Eggz, line: "A social investing app for everyday investors. We designed and built it, and helped lead the company.", image: ../../assets/home/eggz.jpg }
      - { name: Jemurai, line: "A friendly brand for a developer-focused cybersecurity firm, with content strategy, a WordPress site, campaigns and product work.", image: ../../assets/home/jemurai.jpg }
    more:
      - { name: BankTell, line: "A bank finder for businesses that maps nearby banks and requests quotes", image: ../../assets/home/banktell.jpg }
      - { name: Corvid Partners, line: "Bond yield calculations on QuantLib, checked against Bloomberg conventions", image: ../../assets/home/corvid.jpg }
      - { name: Reading Success Lab, line: "Online reading screening and practice from 17 years of UMass research", image: ../../assets/home/rsl.jpg, href: "https://readingsuccesslab.com" }
  - id: websites
    n: "03"
    color: yellow
    title: Websites & branding
    lead: Websites, logos and brands for organizations with a story to tell, from museums to authors and bands.
    facts:
      - "Projects from about $2,500"
      - "Accessible from the first sketch"
      - "Care plans keep sites fast and safe"
    offers:
      - { title: Websites, body: "Fast sites that tell your story well and are easy for your team to update, accessible from the first sketch. Projects start at about $2,500." }
      - { title: Logos and brand identities, body: "Names, logos and visual identities that make your organization easy to recognize and remember, for programs like Campus Champions and Ask.CI, small businesses, authors and artists." }
      - { title: Care plans, body: "Hosting, updates, backups and small fixes, so your site stays fast and safe, whether we built it or not." }
    cta: { label: Tell us about your website, href: /contact/?audience=website }
    workTitle: Website and branding work
    work:
      - { name: Emily Dickinson Virtual Tour, line: "An interactive tour of both Dickinson houses, the Homestead and the Evergreens, room by room.", image: ../../assets/home/dickinson.jpg, href: "https://www.emilydickinsonmuseum.org/homestead-parlors/" }
      - { name: PDMcBride, line: An artist’s portfolio with an online shop., image: ../../assets/home/pdmcbride.jpg }
    more:
      - { name: Molly B. Burnham, line: "A playful site for a children’s book author, built around the books", image: ../../assets/home/burnham.jpg, href: "https://mollybburnham.com" }
      - { name: AroundHere.Live, line: "Live music listings for the Pioneer Valley, with alerts for favorite artists and venues", image: ../../assets/home/aroundhere.jpg, href: "https://aroundhere.live" }
      - { name: Museums, line: "Work for museums including the Ziibiwing Center and the Chicago History Museum", image: ../../assets/home/museums.jpg }
principles:
  title: How we build
  lead: The same practices on every project, from a one-page site to a national platform.
  items:
    - { color: blue, title: Fully tested, text: "Every feature starts with a test, and every change is reviewed before it ships." }
    - { color: orange, title: Not locked in, text: "Our platforms and agents are open source, so your work does not depend on us." }
    - { color: yellow, title: Built accessible, text: "We build to WCAG 2.2 AA and test every page before launch." }
    - { color: blue, title: One team, text: The same people scope your project and build it. }
contact:
  title: Tell us what you are working on
  body: A program, a product, a proposal or a website. Lissie or Andrew will reply within two days.
  button: Contact us
