goal:
  icon: "?"
  title: The goal
  body: |-
    **Show the research, not just the racks.** The MGHPCC in Holyoke, Massachusetts is a shared research computing center for Boston University, Harvard, MIT, Northeastern and the University of Massachusetts. It was the first university research data center to earn LEED Platinum.

    It needed a website that explains what the center does and who it serves, and a presence at SC, the largest supercomputing conference in the world, that pulls people across a crowded floor and into the booth.
  pull: "{ A data center is a building. The research inside it is the story. }"
chapters:
  - level: 2
    title: Our approach
    body: "**One story, from the website to the booth.** We look after mghpcc.org all year, and each fall we create the branded materials for SC, lining up the MGHPCC and SC brand guidelines so the booth, the kiosk and the virtual booth all feel like one place."
    figures:
      - caption: Two brands, one booth
        image:
          src: ../../assets/work/mghpcc-450d49bc.jpg
          alt: The MGHPCC and SC23 logos side by side
    icon: "{ }"
  - level: 3
    title: The MGHPCC website
    body: |-
      **Everything the center does, in one place.** We design and build mghpcc.org on WordPress, so researchers, partners and the public can see what runs in Holyoke and who it serves:

      - A catalog of research projects, from climate to medicine
      - Collaborative projects with regional and national networks
      - Outreach and education, internships and scholarships
      - News, events and monthly publications
    figures:
      - caption: mghpcc.org
        placeholder: "[Screenshot: the mghpcc.org home page]"
  - level: 3
    title: The virtual booth
    body: "**The booth, online.** Each year we build a website for SC that highlights projects at the MGHPCC, so people can keep exploring after they leave the floor."
    figures:
      - caption: The SC23 virtual booth
        image:
          src: ../../assets/work/mghpcc-d76f3008.jpg
          alt: The MGHPCC SC23 virtual booth website
  - level: 3
    title: Research projects
    body: |-
      **Every project gets a video and a face.** A custom content type gives each research project its own page:

      - A video about the project
      - A short summary of the research
      - The researchers involved, with photos
    figures:
      - caption: A research project page
        image:
          src: ../../assets/work/mghpcc-8701240c.jpg
          alt: A research project page for the Harvard Billion Object Platform
  - level: 3
    title: Print displays
    body: "**The green story, in print.** Panels mounted in the booth explain the MGHPCC, with a focus on its green credentials and partner universities. QR codes send people to the website to learn more."
    figures:
      - caption: Booth display panels
        image:
          src: ../../assets/work/mghpcc-d2f48097.jpg
          alt: MGHPCC SC23 display panels
  - level: 3
    title: Animations & interactive kiosk
    body: "**Drawing people in.** The kiosk runs an animated attract loop of researchers and their work, which entices people to step into the booth and explore the projects."
    figures:
      - caption: The kiosk and its attract loop
        image:
          src: ../../assets/work/mghpcc-d51be2c6.jpg
          alt: The MGHPCC SC23 kiosk design
