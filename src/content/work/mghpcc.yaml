goal:
  icon: "?"
  title: The goal
  body: |-
    **Show what a shared research computing center makes possible.** The MGHPCC in Holyoke, Massachusetts is a data center run by a consortium of universities, including Boston University, Harvard, MIT, Northeastern, the University of Massachusetts and Yale. It was the first university research data center to earn LEED Platinum.

    Researchers from the member universities and many other organizations run their work there, from climate models to medicine. The center needed to explain what it is in plain terms, showcase the research those institutions do on its systems, and introduce the community partners it works with. That story had to work on mghpcc.org all year, and at SC, the largest supercomputing conference in the world.
  pull: The MGHPCC is the building. Its members and partners are the story.
chapters:
  - level: 2
    title: Our approach
    body: "**One story, from the website to the booth.** We look after mghpcc.org all year, and each fall we tell stories about the amazing research being done by our principal members and regional partners."
    figures:
      - caption: Bringing MGHPCC to SC
        image:
          src: ../../assets/work/mghpcc-450d49bc.jpg
          alt: The MGHPCC and SC23 logos side by side
    icon: "{ }"
  - level: 3
    title: The MGHPCC website
    body: |-
      **Everything the center does, in one place.** We design and build mghpcc.org on WordPress, so researchers, partners and the public can see what runs in Holyoke and who it serves:

      - A catalog of research projects, from climate to medicine
      - Collaborative projects with regional and national networks
      - Outreach and education, internships and scholarships
      - News, events and monthly publications
    figures:
      - caption: The mghpcc.org home page
        image:
          src: ../../assets/work/mghpcc-home.jpg
          alt: The MGHPCC home page, with a photo of the Holyoke building and the latest news
  - level: 3
    title: The virtual booth
    body: "**The booth, online.** Each year we build a website for SC that highlights projects at the MGHPCC, so people can keep exploring after they leave the floor."
    figures:
      - caption: The SC23 virtual booth
        image:
          src: ../../assets/work/mghpcc-d76f3008.jpg
          alt: The MGHPCC SC23 virtual booth website
  - level: 3
    title: Research projects
    body: |-
      **A page and a video for every project.** A custom content type gives each research project its own page:

      - A video about the project
      - A short summary of the research
      - The researchers involved, with photos
    figures:
      - caption: A research project page
        image:
          src: ../../assets/work/mghpcc-8701240c.jpg
          alt: A research project page for the Harvard Billion Object Platform
  - level: 3
    title: Print displays
    body: "**The green story, in print.** Panels mounted in the booth explain the MGHPCC, with a focus on its green credentials and partner universities. QR codes send people to the website to learn more."
    figures:
      - caption: Booth display panels
        image:
          src: ../../assets/work/mghpcc-d2f48097.jpg
          alt: MGHPCC SC23 display panels
  - level: 3
    title: Animations & interactive kiosk
    body: "**Drawing people in.** The kiosk runs an animated attract loop of researchers and their work, which entices people to step into the booth and explore the projects."
    figures:
      - caption: The kiosk and its attract loop
        image:
          src: ../../assets/work/mghpcc-d51be2c6.jpg
          alt: The MGHPCC SC23 kiosk design
today:
  icon: "!"
  title: Where it is today
  body: "**The MGHPCC heads to SC26 this November.** The booth went online in 2020 with a Minecraft model of the center and its five member universities, and kiosks featuring research projects. It has grown into a virtual booth of project profiles, research highlights and videos that keeps working long after the show floor closes."
