goal:
  icon: "?"
  title: The goal
  body: |-
    **A front door for a growing community.** Open OnDemand lets researchers use a supercomputer from a web browser, with nothing to install and no command line to learn. The Ohio Supercomputer Center has built it since 2015 with NSF support, and its community now spans the country and the world. The website needed to match the Open OnDemand brand, help each audience find what they need, and let institutions share what they know with each other.
  pull: "More than 2,100 organizations run Open OnDemand. Its website has to work for all of them."
chapters:
  - level: 2
    title: Our approach
    body: |-
      **Refresh the brand, simplify the paths.** We refreshed openondemand.org to match the Open OnDemand brand and streamlined the navigation, so people reach what they came for in fewer clicks: running it, administering it or contributing to it.

      Behind the scenes, GitHub Actions automate the Pantheon workflow, so every change is built, tested and deployed the same way.
    figures:
      - caption: The Open OnDemand home page
        image:
          src: ../../assets/work/open-ondemand-e23a36fe.jpg
          alt: The Open OnDemand home page
    icon: "{ }"
  - level: 3
    title: Web communications
    body: "**Keeping the site current.** We make design and web content updates for openondemand.org, so new pages and information look and read like the rest of the site."
    figures:
      - caption: A page design for openondemand.org
        image:
          src: ../../assets/work/open-ondemand-00047439.jpg
          alt: A page on openondemand.org
  - level: 3
    title: Affinity groups
    body: |-
      **Find your people.** Affinity groups bring people from different institutions together around shared topics, so they can collaborate and learn from each other's experience. Each group has:

      - A central place for resources the community recommends
      - Meeting notes, so members can catch up and new members can get up to speed
      - Links to the group's communication channels
    link:
      href: https://openondemand.connectci.org/affinity-groups
      label: See the affinity groups
    figures:
      - caption: The affinity groups postcard for PEARC26
        image:
          src: ../../assets/work/open-ondemand-1d069f7a.jpg
          alt: The Join Community Affinity Groups postcard
  - level: 3
    title: The Appverse
    body: |-
      **A catalog the community builds.** The Appverse is a community catalog of apps for Open OnDemand:

      - Anyone can submit an app from GitHub
      - Submissions sync on a schedule
      - Moderators review, rate and flag issues before they are published
      - More than 100 apps, and a best paper award at PEARC 2026
    link:
      href: https://openondemand.connectci.org/appverse
      label: Browse the Appverse
    figures:
      - caption: The Appverse
        image:
          src: ../../assets/work/open-ondemand-bb59ea73.jpg
          alt: The Open OnDemand Appverse
  - level: 3
    title: Contributor Wall
    body: |-
      **Credit for contributions from the community.** On the Open OnDemand Community Hub, built on Connect.CI, the Contributor Wall shows code, documentation, forum and Appverse contributions across the year, with a rotating Community Spotlight.

      - A daily grid of GitHub and Discourse activity, shown for the whole community and on each member's profile
      - Custom badges, awarded automatically from contribution activity, or by hand for work that doesn't show up in the data
      - Spreadsheet upload to add many contributions at once
    link:
      href: https://openondemand.connectci.org/contributor-wall
      label: See the Contributor Wall
    figures:
      - caption: The Contributor Wall
        image:
          src: ../../assets/work/open-ondemand-f1131371.jpg
          alt: The Community Hub Contributor Wall
