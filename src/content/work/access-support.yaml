goal:
  icon: "?"
  title: The goal
  body: |-
    **A new program, and a lot of people with questions.** In 2022, ACCESS took over from XSEDE as the NSF program that gives researchers time on national computing systems. Many of the people it serves are not computing experts. They are biologists, economists and engineers with a research question and a deadline.

    They needed somewhere to start: how to get an allocation, which system to use, where to find software, and who to ask when they get stuck. [One detail about what support looked like before the portal, if we can share it.]
  pull: Asking for help with a supercomputer should feel as easy as asking a colleague.
chapters:
  - level: 2
    title: Our approach
    body: |-
      **Start with people, not pages.** We worked side by side with the ACCESS support team to decide what researchers need first: a knowledge base, a place to meet others doing similar work, and a clear way to reach a person. We built the portal on Drupal with custom modules, as part of Connect.CI, so it shares profiles and features with other research computing communities.

      The design is professional with a touch of whimsy. Bright shapes and plain language make a technical subject feel welcoming.
    figures:
      - caption: The ACCESS Support home page
        image:
          src: ../../assets/work/access-support-1c8c0c78.jpg
          alt: The ACCESS Support home page
    icon: "{ }"
  - level: 3
    title: Community platform
    body: |-
      **One place for news, events and people.** ACCESS Support runs on Connect.CI, so it shares the platform’s community features and keeps people up to date:

      - Events and announcements
      - Event registration
      - A biweekly email digest
    figures:
      - caption: The biweekly digest
        image:
          src: ../../assets/work/access-support-d38a0270.png
          alt: An ACCESS Support email digest
  - level: 3
    title: AI Assistant
    body: |-
      **Answers at any hour.** A Q&A assistant answers most user questions from the ACCESS documentation, and AI suggests tags for new posts based on what they say.

      That work led to our next step: the [ACCESS AI Assistant](/work/access-ai-assistant/), which also reads live system data.
    figures:
      - caption: The Q&A assistant
        image:
          src: ../../assets/work/access-support-751bec62.gif
          alt: The ACCESS Q&A assistant answering a question
  - level: 3
    title: Affinity groups
    body: "**A home for people who share a focus.** Affinity groups give communities of practice their own space for news, events, resources and email lists. [Which ACCESS affinity groups to name.]"
    figures:
      - caption: "[Affinity groups screenshot]"
        placeholder: "[SCREENSHOT]"
  - level: 3
    title: UI design on the tools
    body: |-
      **Tools that are easy to use.** We designed the interfaces for ACCESS tools that help researchers plan their work:

      - ARA, the ACCESS Resource Advisor, which helps researchers find the right resources
      - SDS, the Software Documentation Service, which shows the software installed on each system
      - Resource documentation pages, built from a template we designed and built
    figures:
      - caption: The Software Documentation Service
        image:
          src: ../../assets/work/access-support-035bb12a.jpg
          alt: The Software Documentation Service
  - level: 3
    title: Researcher stories
    body: "**Showing what researchers do with ACCESS.** [One or two sentences on the researcher stories: what they cover, where they appear and why they matter.]"
    figures:
      - caption: "[Researcher stories screenshot]"
        placeholder: "[SCREENSHOT]"
