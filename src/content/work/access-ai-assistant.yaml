goal:
  icon: "?"
  title: The goal
  body: |-
    **Good answers need the docs and the live system at once.** ACCESS researchers ask questions that mix the two: how to request a GPU allocation, and which GPU systems are up today. Documentation answers the first half. The second lives in allocation, status and resource systems that a documentation chatbot cannot see.

    When an assistant cannot see live data, it either guesses or sends people to file a ticket. ACCESS support handles more than 10,000 tickets a year.
  pull: "Which GPU systems can I get time on, and which are up today?"
chapters:
  - level: 2
    title: Our approach
    body: |-
      **One agent, documentation plus 11 live data sources.** We built a support agent that answers ACCESS documentation questions and live questions in the same conversation, like which GPU resources are available or what is down for maintenance.

      For ACCESS it runs on an open model hosted by a partner university. Programs whose policies allow it can use commercial models instead.
    figures:
      - caption: The ACCESS AI Assistant, full screen at qa.access-ci.org
        image:
          src: ../../assets/work/access-ai-fullscreen.jpg
          alt: The ACCESS AI Assistant start screen, with the ACCESS site navigation above a single message box
    icon: "{ }"
  - level: 3
    title: Support agent
    body: |-
      **From a question to a checked answer.** Every question goes through the same steps:

      - A researcher asks in plain language, mixing how-to and right-now questions
      - The agent plans which sources the question needs
      - It reads the documentation and the live data
      - It gives one answer, with live facts and documentation together
      - If it cannot help, it opens a ticket for a person
    figures:
      - caption: "How the agent works: the researcher's verified identity flows through to the tools that act, and the model, retrieval and data stores stay inside the institution. From the HUST @ SC26 paper."
        wide: true
        image:
          src: ../../assets/work/access-ai-architecture.png
          alt: "Architecture diagram. A user signs in with CILogon in the browser or chat, and a verified identity token (JWT) passes to the agent: a single tool-calling loop that manages context and verifies identity. The agent uses an open model, Qwen on the University of Kentucky's vLLM; retrieval over a curated documentation corpus; read tools for status, hardware, software, events, allocations and XDMoD; and write tools for tickets, events and announcements, gated by the acting user's identity token. Sessions, evaluations and reviews go to data stores. Everything sits inside an institutional boundary, and only metadata telemetry leaves it. Verified identity end to end."
  - level: 3
    title: 11 MCP servers
    body: |-
      **Live ACCESS data, open to any AI tool.** Each server connects the agent to one ACCESS system. They are public at mcp.access-ci.org, so researchers can add them to Claude themselves:

      - Allocations
      - Compute resources
      - System status
      - Events
      - Announcements
      - Software
      - Affinity groups
      - NSF awards
      - Usage charts
      - Usage data
      - Ticketing
    figures:
      - caption: "Example: upcoming GPU training, read live from the ACCESS events server"
        image:
          src: ../../assets/work/access-ai-events-answer.jpg
          alt: "The ACCESS AI Assistant listing an upcoming GPU programming course on November 10, 2026, with speaker, description and registration link"
  - level: 3
    title: From answering to acting
    body: "**It can register a researcher for a training.** Asked to sign someone up for a training, the agent finds the event, checks the seats and shows exactly what would happen. Nothing is submitted until the researcher confirms, and the registration is made under their own signed-in identity, just as if they had used the events portal themselves."
    figures:
      - caption: "Example from our test environment: the agent explains, and the researcher confirms in the side pane."
        image:
          src: ../../assets/work/access-ai-registration.jpg
          alt: "The ACCESS AI Assistant with an Event registration side pane for Introduction to GPU Programming: not registered yet, 40 seats left, and a Confirm registration button with the note Nothing is submitted until you confirm"
  - level: 3
    title: How we test it
    body: |-
      **Tested against questions experts write.** An answer can sound right and still be wrong. A researcher asked whether a system would be up next week. An assistant that only read the documentation said it was fully operational, but maintenance had just been postponed. Our agent checked the live status feed and got it right.

      We grade every answer on the facts it contains, and the process also catches errors in the documentation itself, which go back to the team that owns the page. The full method and results are in the paper below.
    figures:
      - wide: true
        process:
          steps:
            - Staff write questions and the facts a good answer must include
            - The agent answers every question
            - A judge checks each answer, fact by fact
            - Reviewers check the judge, without seeing its scores
            - The change ships only if answers hold up
today:
  icon: "!"
  title: Where it is today
  body: |-
    **In use at ACCESS, and ready for other programs.** The agent answers ACCESS researchers today, full screen at qa.access-ci.org and in the Q&A widget on support.access-ci.org. For ACCESS it runs on an open model hosted by the University of Kentucky, so researchers' questions never go to a commercial AI provider.

    The agent and its MCP servers are open source. A program with its own documentation and systems can start from the same code, and the same evaluation keeps the answers honest as it grows.
  figures:
    - caption: The ACCESS Q&A widget on support.access-ci.org
      image:
        src: ../../assets/work/access-ai-assistant-751bec62.png
        alt: "The ACCESS Q&A widget answering how to get a large allocation for medical research using AI, with Helpful and Not helpful buttons"
