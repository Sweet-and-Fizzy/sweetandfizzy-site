goal:
  icon: "?"
  title: The goal
  body: |-
    **Good answers need the docs and the live system at once.** ACCESS researchers ask questions that mix the two: how to request a GPU allocation, and which GPU systems are up today. Documentation answers the first half. The second lives in allocation, status and resource systems that a documentation chatbot cannot see.

    When an assistant cannot see live data, it either guesses or sends people to file a ticket. ACCESS support handled 10,834 tickets in the year to June 2026.
  pull: "{ The docs know how. The live systems know right now. Researchers need both. }"
chapters:
  - level: 2
    title: Our approach
    body: |-
      **One agent, documentation plus 11 live data sources.** We built a support agent that answers ACCESS documentation questions and live questions in the same conversation, like which GPU resources are available or what is down for maintenance.

      It runs on commercial models or on open models hosted by a partner university, so ACCESS can choose.
    figures:
      - caption: The ACCESS Assistant, full screen at qa.access-ci.org
        image:
          src: ../../assets/work/access-ai-fullscreen.jpg
          alt: The ACCESS Assistant start screen, with the ACCESS site navigation above a single message box
    icon: "{ }"
  - level: 3
    title: Support agent
    body: |-
      **From a question to a checked answer.** Every question goes through the same steps:

      - A researcher asks in plain language, mixing how-to and right-now questions
      - The agent plans which sources the question needs
      - It reads the documentation and the live data
      - It gives one answer, with live facts and documentation together
      - If it cannot help, it opens a ticket for a person
    figures:
      - caption: "How the agent works: the researcher's verified identity flows through to the tools that act, and the model, retrieval and data stores stay inside the institution. From the HUST @ SC26 paper."
        wide: true
        image:
          src: ../../assets/work/access-ai-architecture.png
          alt: "Architecture diagram. A user signs in with CILogon; a verified identity token passes to the agent, which uses an open model hosted at the University of Kentucky, retrieval over curated documentation, read tools for status, hardware, software, events and allocations, and write tools for tickets, events and announcements gated by the acting user's identity. Everything sits inside an institutional boundary, with only metadata telemetry leaving it."
  - level: 3
    title: 11 MCP servers
    body: |-
      **Live ACCESS data, open to any AI tool.** Each server connects the agent to one ACCESS system. They are public at mcp.access-ci.org, so researchers can add them to Claude themselves:

      - Allocations
      - Compute resources
      - System status
      - Events
      - Announcements
      - Software
      - Affinity groups
      - NSF awards
      - Usage metrics
      - Ticketing
    figures:
      - caption: Upcoming GPU training, read live from the ACCESS events server
        image:
          src: ../../assets/work/access-ai-events-answer.jpg
          alt: "The ACCESS Assistant listing an upcoming GPU programming course on November 10, 2026, with speaker, description and registration link"
  - level: 3
    title: Evaluation battery
    body: |-
      **Measured, not demoed.** An answer can sound right and still be wrong. Asked whether a system would be up next week, the documentation-only assistant the agent replaced said it was fully operational, the week its maintenance moved. The agent read the live status feed and gave the new dates.

      So we check answers against facts, not tone. ACCESS staff write the test questions and the facts a good answer must include. An automated judge grades every answer fact by fact, and human reviewers who never see its scores keep the judge honest. The full method and results are in the paper.
    figures:
      - caption: How every change to the agent is checked before it ships
        wide: true
        process:
          steps:
            - Staff write questions and the facts a good answer must include
            - The agent answers every question
            - A judge checks each answer, fact by fact
            - Reviewers check the judge, without seeing its scores
            - The change ships only if answers hold up
          loop: Facts that reviewers flag become documentation fixes, sent back to whoever owns the page
