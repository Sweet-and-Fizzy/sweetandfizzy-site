goal:
  icon: "?"
  title: The goal
  body: |-
    **Good answers need the docs and the live system at once.** ACCESS researchers ask questions that mix the two: how to request a GPU allocation, and which GPU systems are up today. Documentation answers the first half. The second lives in allocation, status and resource systems that a documentation chatbot cannot see.

    When an assistant cannot see live data, it either guesses or sends people to file a ticket. [Ticket volume or a typical example from ACCESS support, if we can share it.]
  pull: "{ The docs know how. The live systems know right now. Researchers need both. }"
chapters:
  - level: 2
    title: Our approach
    body: |-
      **One agent, documentation plus 11 live data sources.** We built a support agent that answers ACCESS documentation questions and live questions in the same conversation, like which GPU resources are available or what is down for maintenance.

      It runs on commercial models or on open models hosted by a partner university, so ACCESS can choose.
    figures:
      - caption: Answering a GPU planning question with live outage data
        image:
          src: ../../assets/work/access-ai-assistant-d6b1fc20.jpg
          alt: The ACCESS support agent answering a GPU planning question with live outage data
    icon: "{ }"
  - level: 3
    title: Support agent
    body: |-
      **From a question to a checked answer.** Every question goes through the same steps:

      - A researcher asks in plain language, mixing how-to and right-now questions
      - The agent plans which sources the question needs
      - It reads the documentation and the live data
      - It gives one answer, with live facts and documentation together
      - If it cannot help, it opens a ticket for a person
    figures:
      - caption: The Q&A assistant
        image:
          src: ../../assets/work/access-ai-assistant-751bec62.gif
          alt: The ACCESS Q&A assistant answering a question
  - level: 3
    title: 11 MCP servers
    body: |-
      **Live ACCESS data, open to any AI tool.** Each server connects the agent to one ACCESS system. They are public at mcp.access-ci.org, so researchers can add them to Claude themselves:

      - Allocations
      - Compute resources
      - System status
      - Events
      - Announcements
      - Software
      - Affinity groups
      - NSF awards
      - Usage metrics
      - Ticketing
    figures:
      - caption: mcp.access-ci.org
        placeholder: "[Screenshot: the ACCESS MCP setup guide]"
  - level: 3
    title: Evaluation battery
    body: "**Measured, not demoed.** We grade the agent against questions written by people, fact by fact. Each required fact comes from the documentation, never from the agent’s own answer."
    figures:
      - caption: How the agent is evaluated
        placeholder: "[Architecture diagram from the HUST paper, once it is published]"
